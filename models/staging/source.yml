version: 2
sources:
    - name: datafeed_shared_schema
      database: sales
      schema: raw_layer
      tables:
        - name: RAW_CUSTOMER
        - name : customers
        - name : emp_sal 
        - name : raw_orders
          columns:
            - name: id
              tests:
                - unique
                - not_null
            - name: status
              tests:
                - accepted_values:
                    arguments:
                      values: ['placed', 'shipped', 'completed', 'returned', 'return_pending']
        
    - name: datafeed_public_schema
      database: sales
      schema: public
      tables:

      - name: customers
